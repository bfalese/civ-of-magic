<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civ of Magic</title>
<!--
    The web frontend: the game core as wasm (frontend/wasm) driven through JSON, the map in
    Three.js (isometric 3D, map3d.js; ?view=2d for the flat map), sprites from the user's own export (util/export-assets). For development:
        go run ./util/serve-web      then open http://localhost:8080
-->
<style>
    :root {
        --bg: #0d0a07; --panel: rgba(28, 22, 15, 0.92); --border: #5a4630; --text: #eadfc4;
        --dim: #a3936f; --accent: #e0b04a; --good: #8fd06a; --bad: #e0705a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 "Courier New", monospace; overflow: hidden; }
    #map { position: fixed; inset: 0; }
    #map canvas { display: block; image-rendering: pixelated; }
    .panel { position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: 3px; padding: 6px 8px; }
    #top { top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
    #top .spacer { flex: 1; }
    #top button { padding: 3px 6px; }
    #top .research { min-width: 0; max-width: 8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #top b { color: var(--accent); font-weight: normal; }
    #side { top: 56px; right: 8px; width: 260px; max-height: calc(100% - 400px); min-height: 0; overflow: auto; }
    #side:empty { display: none; }
    #log { left: 8px; bottom: 8px; width: min(560px, calc(100% - 16px)); height: 150px; overflow: auto; font-size: 12px; }
    #log div { border-bottom: 1px solid rgba(90, 70, 48, 0.4); padding: 1px 0; }
    #log .turn { color: var(--accent); }
    button { font: inherit; color: var(--text); background: #3a2d1d; border: 1px solid var(--border); border-radius: 3px; padding: 3px 10px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.4; cursor: default; }
    h3 { margin: 0 0 4px; font-size: 13px; color: var(--accent); font-weight: normal; }
    .unit { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .unit.inactive > label { color: var(--dim); }
    .unit input { vertical-align: middle; margin: 0 2px 0 0; }
    button.tiny { padding: 0 4px; margin-left: 3px; font-size: 11px; line-height: 14px; }
    .unit-details { margin: 2px 0 6px 18px; font-size: 12px; }
    .orders { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 6px; }
    .orders button.small { padding: 1px 6px; }
    .busy { color: var(--accent); }
    .unit-details .enchanted { color: var(--accent); }
    #vault { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.35); }
    #vault.open { display: flex; }
    #vault > .panel { position: static; width: min(720px, calc(100% - 16px)); max-height: calc(100% - 16px); overflow: auto; padding: 10px 12px; }
    #vault .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #vault .gap { margin-top: 10px; }
    #vault button.small { padding: 0 6px; }
    #vault .vault-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px; margin-top: 4px; }
    #vault .vault-hero { margin-top: 6px; }
    #vault .item-slot { display: flex; align-items: center; gap: 6px; min-height: 44px; text-align: left; padding: 2px 6px; }
    #vault .item-slot canvas { image-rendering: pixelated; flex: none; }
    #vault .item-slot.empty { color: var(--dim); justify-content: center; border-style: dashed; }
    #vault .item-slot.chosen { border-color: var(--accent); background: #5a4326; }
    #vault .item-slot.unfit { opacity: 0.4; }
    #lists { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.35); }
    #lists.open { display: flex; }
    #lists > .panel { position: static; width: min(760px, calc(100% - 16px)); max-height: calc(100% - 16px); overflow: auto; padding: 10px 12px; }
    #lists .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #lists button.small { padding: 0 6px; }
    #lists .tabs { display: flex; gap: 4px; }
    #lists .chosen { border-color: var(--accent); background: #5a4326; }
    #lists table.list { width: 100%; border-collapse: collapse; margin-top: 6px; }
    #lists th { text-align: left; font-weight: normal; color: var(--dim); border-bottom: 1px solid var(--border); padding: 2px 6px; }
    #lists td { padding: 2px 6px; vertical-align: middle; }
    #lists tbody tr { cursor: pointer; }
    #lists tbody tr:hover { background: #3a2d1d; }
    #lists tfoot td { border-top: 1px solid var(--border); }
    #lists .number { text-align: right; white-space: nowrap; }
    #lists .bad { color: #ff7a50; }
    #lists td.sprite { width: 1px; padding: 1px 4px; }
    #lists td.sprite canvas { display: block; width: 40px; height: 36px; image-rendering: pixelated; }
    #lists .list-heroes { margin-top: 4px; }
    #diplomacy { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.35); }
    #diplomacy.open { display: flex; }
    #diplomacy > .panel { position: static; width: min(680px, calc(100% - 16px)); max-height: calc(100% - 16px); overflow: auto; padding: 10px 12px; }
    #diplomacy .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    #diplomacy button.small { padding: 0 6px; }
    #diplomacy .wizard { border-top: 1px solid var(--border); padding: 6px 0; margin-top: 6px; }
    #diplomacy .wizard.you { border-top: none; margin-top: 0; }
    #diplomacy .wizard.with-portrait { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; }
    #diplomacy .wizard.with-portrait > .portrait { grid-row: 1 / span 9; align-self: start; }
    #diplomacy .wizard.with-portrait > :not(.portrait) { grid-column: 2; }
    #magic .magic-title { display: flex; align-items: center; gap: 8px; }
    #start .start-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 6px; }
    #start .start-portrait { line-height: 0; }
    #start .start-portrait:empty { display: none; }
    #start .start-builder { border: 1px solid var(--border); border-radius: 3px; padding: 6px 8px; margin: 0 0 10px; }
    #start .start-portraits { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0 6px; }
    #start .start-portrait-choice { padding: 1px; line-height: 0; min-width: 24px; min-height: 24px; }
    #start .start-books { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 6px; }
    #start .start-book { display: inline-flex; align-items: center; gap: 4px; }
    #start .start-book > span:first-child { width: 4.5em; }
    #start .start-book b { width: 1.5em; text-align: center; font-weight: normal; color: var(--accent); }
    #start .start-retorts { display: flex; flex-wrap: wrap; gap: 3px; }
    #start .start-retorts button.small, #start .start-book button.small { padding: 0 6px; }
    #start .start-error { margin-top: 4px; color: var(--bad); }
    #start .start-portrait canvas { border: 1px solid var(--border); }
    #diplomacy .mirror { margin: 2px 0; }
    #diplomacy .mood { display: grid; grid-template-columns: 6em 1fr; align-items: center; gap: 8px; margin: 3px 0; }
    #diplomacy .meter { position: relative; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #a83a2a, #6a6050 50%, #4f9a3e); }
    #diplomacy .meter span { position: absolute; top: -3px; width: 4px; height: 12px; margin-left: -2px; background: var(--text); border-radius: 1px; }
    #diplomacy .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 4px; }
    #diplomacy .actions > span:first-child { width: 4.5em; color: var(--dim); }
    #diplomacy .actions.offer > span:first-child { width: auto; color: var(--accent); }
    #diplomacy select { font: inherit; color: var(--text); background: #1d160e; border: 1px solid var(--border); padding: 0 2px; max-width: 14em; }
    #diplomacy .magic-message { margin-top: 8px; color: var(--accent); min-height: 1.2em; }
    #vault .magic-message { margin-top: 8px; color: var(--accent); min-height: 1.2em; }
    .dim { color: var(--dim); }
    #ending { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.7); z-index: 30; }
    #ending.open { display: flex; }
    #ending > .panel { position: static; width: min(460px, calc(100% - 32px)); padding: 16px 18px; text-align: center; }
    #ending h2 { margin: 6px 0; color: var(--accent); font-weight: normal; }
    #ending .ending-portrait { line-height: 0; }
    #ending .ending-portrait canvas { border: 1px solid var(--border); }
    #ending .choices { display: flex; gap: 8px; justify-content: center; }
    #modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.45); }
    #modal.open { display: flex; }
    #modal .panel { position: static; max-width: min(420px, calc(100% - 32px)); padding: 12px 14px; }
    #modal .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    #city { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.35); }
    #city.open { display: flex; }
    #city > .panel { position: static; width: min(760px, calc(100% - 16px)); max-height: calc(100% - 16px); overflow: auto; padding: 10px 12px; }
    #city .columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; margin-top: 6px; }
    #city .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #city .gap { margin-top: 10px; }
    #city .options { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px; }
    #city .option { display: flex; justify-content: space-between; gap: 6px; text-align: left; padding: 2px 6px; }
    #city .option.current { border-color: var(--accent); color: var(--accent); }
    #city button.small { padding: 0 6px; }
    @media (max-width: 640px) { #city .columns { grid-template-columns: 1fr; } }
    #magic { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.35); }
    #magic.open { display: flex; }
    #magic > .panel { position: static; width: min(820px, calc(100% - 16px)); max-height: calc(100% - 16px); overflow: auto; padding: 10px 12px; }
    #magic .columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 16px; margin-top: 6px; }
    #magic .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #magic .gap { margin-top: 10px; }
    #magic .share { display: grid; grid-template-columns: 9em 1fr 5.5em; align-items: center; gap: 6px; margin-top: 4px; }
    #magic .share input { width: 100%; accent-color: var(--accent); }
    #magic .alchemy { justify-content: flex-start; margin-top: 4px; }
    #magic .alchemy input { width: 5em; font: inherit; color: var(--text); background: #1d160e; border: 1px solid var(--border); padding: 2px 4px; }
    #magic .spellbook h3 { margin-top: 6px; }
    #magic .spell-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 4px; }
    #magic .spell { display: flex; justify-content: space-between; gap: 6px; text-align: left; padding: 2px 6px; }
    #magic button.small { padding: 0 6px; }
    #magic .magic-message { margin-top: 8px; color: var(--accent); min-height: 1.2em; }
    #tax { font: inherit; color: var(--text); background: #1d160e; border: 1px solid var(--border); padding: 0 2px; }
    #city .rename, #vault .rename { display: flex; gap: 4px; align-items: center; }
    #vault button.tiny { padding: 0 4px; font-size: 11px; line-height: 14px; }
    #vault .rename input,
    #city .rename input { font: inherit; color: var(--text); background: #1d160e; border: 1px solid var(--border); padding: 1px 4px; width: 12em; }
    #city button.tiny { padding: 0 4px; font-size: 11px; line-height: 14px; }
    #city .curse { color: #ff8a70; }
    #magic .enchantment { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    #magic .item-types, #magic .item-images { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    #magic .chosen { border-color: var(--accent); background: #5a4326; }
    #magic .item-image { padding: 2px; line-height: 0; }
    #magic .item-name { margin: 6px 0; justify-content: flex-start; }
    #magic input[type=text], #magic select { font: inherit; color: var(--text); background: #1d160e; border: 1px solid var(--border); padding: 1px 4px; max-width: 100%; }
    #magic .item-group { display: grid; grid-template-columns: 7em minmax(0, 1fr) auto; align-items: center; gap: 6px; margin-top: 3px; }
    #magic .item-many { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1px 8px; }
    #magic .item-many input { vertical-align: middle; }
    @media (max-width: 640px) { #magic .columns { grid-template-columns: 1fr; } }
    #battle { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #000; }
    #battle.open { display: flex; }
    #battle .panel { position: static; }
    #battle .battle-bar { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; width: min(960px, calc(100% - 16px)); }
    #battle .battle-bar .spacer { flex: 1; }
    #battle .battle-title { color: var(--accent); }
    #battle canvas { image-rendering: pixelated; cursor: crosshair; max-width: calc(100% - 16px); }
    #battle .battle-hint { font-size: 11px; color: var(--dim); max-width: calc(100% - 16px); }
    #battle .battle-hint.battle-message { color: var(--accent); }
    #battle .battle-mana { color: var(--dim); }
    #battle .battle-stage { position: relative; max-width: calc(100% - 16px); }
    #battle .battle-stage canvas { display: block; max-width: 100%; }
    #battle .battle-spells { position: absolute; top: 8px; left: 8px; right: 8px; max-height: calc(100% - 16px); overflow: auto; z-index: 2; }
    #battle .battle-info { position: absolute; top: 8px; right: 8px; width: min(240px, calc(100% - 16px)); font-size: 11px; line-height: 1.35; pointer-events: none; z-index: 1; }
    #battle .battle-info .battle-info-list { color: var(--dim); margin-top: 2px; }
    #battle .battle-log { position: absolute; left: 8px; bottom: 6px; width: min(420px, calc(100% - 16px)); font-size: 11px; line-height: 1.3; color: var(--text); text-shadow: 1px 1px 0 #000, -1px 0 0 #000; pointer-events: none; opacity: 0.85; }
    #battle .battle-log div:last-child { color: var(--accent); }
    #battle .battle-spells > h3 { margin-top: 4px; }
    #battle .battle-spells > button { margin-top: 6px; }
    #battle .battle-spell-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px; }
    #battle .battle-spell { display: flex; justify-content: space-between; gap: 6px; text-align: left; padding: 2px 6px; }
    #battle .battle-choice { display: flex; align-items: center; gap: 6px; text-align: left; padding: 2px 6px; }
    #battle .battle-choice canvas { image-rendering: pixelated; width: 40px; height: auto; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); }
    [hidden] { display: none !important; }
    #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 8px; }
    #start > .panel { position: static; width: min(760px, 100%); max-height: 100%; overflow: auto; padding: 12px 14px; }
    #start h2 { margin: 0 0 8px; color: var(--accent); font-weight: normal; }
    #start .start-continue { display: flex; flex-direction: column; align-items: stretch; gap: 4px; margin-bottom: 12px; }
    #start .start-continue button { text-align: left; }
    #game { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.5); z-index: 20; }
    #game.open { display: flex; }
    #game > .panel { position: static; width: min(420px, calc(100% - 32px)); padding: 12px 14px; }
    #game .game-actions { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
    #game .game-actions button { text-align: left; }
    #game .message { min-height: 1.2em; margin-top: 6px; color: var(--accent); }
    #start .start-wizards { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 4px; margin: 4px 0 10px; }
    #start .start-wizard { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; padding: 3px 7px; }
    #start .chosen { border-color: var(--accent); background: #5a4326; }
    #start .start-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 14px; margin-bottom: 10px; }
    #start label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #start input, #start select { font: inherit; color: var(--text); background: #1d160e; border: 1px solid var(--border); padding: 1px 4px; width: 10em; }
    #start .start-banners { display: flex; gap: 4px; }
    #start .swatch { width: 22px; height: 22px; padding: 0; }
    #start .swatch.chosen { outline: 2px solid var(--text); outline-offset: 1px; }
    #start .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #hint { right: 8px; bottom: 8px; font-size: 11px; color: var(--dim); }
    #corner { position: fixed; right: 8px; bottom: 40px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; }
    #corner .panel { position: static; pointer-events: auto; }
    #minimap { padding: 4px; line-height: 0; }
    #minimap canvas { image-rendering: pixelated; cursor: crosshair; }
    #tileinfo { width: 220px; font-size: 12px; pointer-events: none !important; }
    #tileinfo .row { display: flex; justify-content: space-between; gap: 6px; }
    #tileinfo .site { margin-top: 3px; border-top: 1px solid var(--border); padding-top: 2px; }
    @media (max-width: 640px) { #side { width: calc(100% - 16px); top: auto; bottom: 166px; max-height: 30%; } #hint { display: none; } #corner { display: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="map"></div>
<div id="loading">loading…</div>
<div id="start" hidden></div>
<div id="top" class="panel" hidden>
    <button id="gameButton" title="game: save, load, new (G)">☰</button>
    <span id="date"></span>
    <span>gold <b id="gold"></b></span>
    <span>mana <b id="mana"></b></span>
    <span>food <b id="food"></b></span>
    <label title="tax: gold per citizen (unrest it causes)">tax <select id="tax"></select></label>
    <span class="research">research <b id="research"></b></span>
    <span class="spacer"></span>
    <button id="plane">Myrror</button>
    <button id="listsButton" title="cities (C) and armies (A)">Lists</button>
    <button id="magicButton" title="M">Magic</button>
    <button id="itemsButton" title="I">Items</button>
    <button id="wizardsButton" title="W">Wizards</button>
    <button id="nextUnit" title="next unit (N)">Next</button>
    <button id="endTurn" title="Enter">End turn</button>
</div>
<div id="side" class="panel"></div>
<div id="log" class="panel" hidden></div>
<div id="hint" class="panel" hidden>drag: pan · wheel/+−: zoom · click a stack, then a tile: move · N next unit · C cities · A armies · M magic · I items · W wizards · G game · Enter: end turn</div>
<div id="game"></div>
<div id="corner" hidden>
    <div id="tileinfo" class="panel" hidden></div>
    <div id="minimap" class="panel" title="click or drag: move the view"><canvas></canvas></div>
</div>
<div id="lists"></div>
<div id="city"></div>
<div id="magic"></div>
<div id="vault"></div>
<div id="diplomacy"></div>
<div id="battle"></div>
<div id="ending"></div>
<div id="modal"><div class="panel"><div id="modalText"></div><div class="choices" id="modalChoices"></div></div></div>
<script src="wasm_exec.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
