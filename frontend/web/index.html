<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civ of Magic</title>
<!--
    The web frontend: the game core as wasm (frontend/wasm) driven through JSON, the map in
    Three.js, sprites from the user's own export (util/export-assets). For development:
        go run ./util/serve-web      then open http://localhost:8080
-->
<style>
    :root {
        --bg: #0d0a07; --panel: rgba(28, 22, 15, 0.92); --border: #5a4630; --text: #eadfc4;
        --dim: #a3936f; --accent: #e0b04a; --good: #8fd06a; --bad: #e0705a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 "Courier New", monospace; overflow: hidden; }
    #map { position: fixed; inset: 0; }
    #map canvas { display: block; image-rendering: pixelated; }
    .panel { position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: 3px; padding: 6px 8px; }
    #top { top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
    #top .spacer { flex: 1; }
    #top b { color: var(--accent); font-weight: normal; }
    #side { top: 56px; right: 8px; width: 260px; max-height: calc(100% - 230px); overflow: auto; }
    #side:empty { display: none; }
    #log { left: 8px; bottom: 8px; width: min(560px, calc(100% - 16px)); height: 150px; overflow: auto; font-size: 12px; }
    #log div { border-bottom: 1px solid rgba(90, 70, 48, 0.4); padding: 1px 0; }
    #log .turn { color: var(--accent); }
    button { font: inherit; color: var(--text); background: #3a2d1d; border: 1px solid var(--border); border-radius: 3px; padding: 3px 10px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.4; cursor: default; }
    h3 { margin: 0 0 4px; font-size: 13px; color: var(--accent); font-weight: normal; }
    .unit { display: flex; justify-content: space-between; gap: 8px; }
    .dim { color: var(--dim); }
    #modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.45); }
    #modal.open { display: flex; }
    #modal .panel { position: static; max-width: min(420px, calc(100% - 32px)); padding: 12px 14px; }
    #modal .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    #city { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.35); }
    #city.open { display: flex; }
    #city > .panel { position: static; width: min(760px, calc(100% - 16px)); max-height: calc(100% - 16px); overflow: auto; padding: 10px 12px; }
    #city .columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; margin-top: 6px; }
    #city .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #city .gap { margin-top: 10px; }
    #city .options { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px; }
    #city .option { display: flex; justify-content: space-between; gap: 6px; text-align: left; padding: 2px 6px; }
    #city .option.current { border-color: var(--accent); color: var(--accent); }
    #city button.small { padding: 0 6px; }
    @media (max-width: 640px) { #city .columns { grid-template-columns: 1fr; } }
    #magic { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.35); }
    #magic.open { display: flex; }
    #magic > .panel { position: static; width: min(820px, calc(100% - 16px)); max-height: calc(100% - 16px); overflow: auto; padding: 10px 12px; }
    #magic .columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 16px; margin-top: 6px; }
    #magic .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #magic .gap { margin-top: 10px; }
    #magic .share { display: grid; grid-template-columns: 9em 1fr 5.5em; align-items: center; gap: 6px; margin-top: 4px; }
    #magic .share input { width: 100%; accent-color: var(--accent); }
    #magic .alchemy { justify-content: flex-start; margin-top: 4px; }
    #magic .alchemy input { width: 5em; font: inherit; color: var(--text); background: #1d160e; border: 1px solid var(--border); padding: 2px 4px; }
    #magic .spellbook h3 { margin-top: 6px; }
    #magic .spell-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 4px; }
    #magic .spell { display: flex; justify-content: space-between; gap: 6px; text-align: left; padding: 2px 6px; }
    #magic button.small { padding: 0 6px; }
    #magic .magic-message { margin-top: 8px; color: var(--accent); min-height: 1.2em; }
    @media (max-width: 640px) { #magic .columns { grid-template-columns: 1fr; } }
    #battle { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #000; }
    #battle.open { display: flex; }
    #battle .panel { position: static; }
    #battle .battle-bar { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; width: min(960px, calc(100% - 16px)); }
    #battle .battle-bar .spacer { flex: 1; }
    #battle .battle-title { color: var(--accent); }
    #battle canvas { image-rendering: pixelated; cursor: crosshair; max-width: calc(100% - 16px); }
    #battle .battle-hint { font-size: 11px; color: var(--dim); max-width: calc(100% - 16px); }
    #battle .battle-hint.battle-message { color: var(--accent); }
    #battle .battle-mana { color: var(--dim); }
    #battle .battle-stage { position: relative; max-width: calc(100% - 16px); }
    #battle .battle-stage canvas { display: block; max-width: 100%; }
    #battle .battle-spells { position: absolute; top: 8px; left: 8px; right: 8px; max-height: calc(100% - 16px); overflow: auto; z-index: 2; }
    #battle .battle-info { position: absolute; top: 8px; right: 8px; width: min(240px, calc(100% - 16px)); font-size: 11px; line-height: 1.35; pointer-events: none; z-index: 1; }
    #battle .battle-info .battle-info-list { color: var(--dim); margin-top: 2px; }
    #battle .battle-log { position: absolute; left: 8px; bottom: 6px; width: min(420px, calc(100% - 16px)); font-size: 11px; line-height: 1.3; color: var(--text); text-shadow: 1px 1px 0 #000, -1px 0 0 #000; pointer-events: none; opacity: 0.85; }
    #battle .battle-log div:last-child { color: var(--accent); }
    #battle .battle-spells > h3 { margin-top: 4px; }
    #battle .battle-spells > button { margin-top: 6px; }
    #battle .battle-spell-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px; }
    #battle .battle-spell { display: flex; justify-content: space-between; gap: 6px; text-align: left; padding: 2px 6px; }
    #battle .battle-choice { display: flex; align-items: center; gap: 6px; text-align: left; padding: 2px 6px; }
    #battle .battle-choice canvas { image-rendering: pixelated; width: 40px; height: auto; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); }
    #hint { right: 8px; bottom: 8px; font-size: 11px; color: var(--dim); }
    @media (max-width: 640px) { #side { width: calc(100% - 16px); top: auto; bottom: 166px; max-height: 30%; } #hint { display: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="map"></div>
<div id="loading">loading…</div>
<div id="top" class="panel" hidden>
    <span id="date"></span>
    <span>gold <b id="gold"></b></span>
    <span>mana <b id="mana"></b></span>
    <span>food <b id="food"></b></span>
    <span>research <b id="research"></b></span>
    <span class="spacer"></span>
    <button id="plane">Myrror</button>
    <button id="magicButton" title="M">Magic</button>
    <button id="nextUnit" title="N">Next unit</button>
    <button id="endTurn" title="Enter">End turn</button>
</div>
<div id="side" class="panel"></div>
<div id="log" class="panel" hidden></div>
<div id="hint" class="panel" hidden>drag: pan · wheel/+−: zoom · click a city: city screen · click a stack, then a tile: move · N: next unit · M: magic · Enter: end turn</div>
<div id="city"></div>
<div id="magic"></div>
<div id="battle"></div>
<div id="modal"><div class="panel"><div id="modalText"></div><div class="choices" id="modalChoices"></div></div></div>
<script src="wasm_exec.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
