name: Build Linux

on:
  push:
  # by hand from the Actions tab: also runs the arm64 job
  workflow_dispatch:

jobs:
  build:
    name: Build code
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.27.0'

      - name: Install ubuntu dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libasound2-dev xorg-dev
          # for running the tests
          sudo apt-get -y install xvfb

      - name: Install go dependencies
        run: |
          go get ./...
          go mod tidy

      - name: Core must not depend on rendering
        run: |
          if go list -deps ./core/... | grep -E 'ebiten|/lbx'; then
            echo "core/ imports rendering or LBX"; exit 1
          fi

      - name: Wasm core (core only, no rendering)
        run: |
          if GOOS=js GOARCH=wasm go list -deps ./frontend/wasm | grep -E 'ebiten|/lbx'; then
            echo "frontend/wasm imports rendering or LBX"; exit 1
          fi
          GOOS=js GOARCH=wasm go vet ./frontend/wasm
          GOOS=js GOARCH=wasm go build -o core.wasm ./frontend/wasm

      - name: Vet
        run: go vet ./...

      - name: Test
        run: xvfb-run go test -coverprofile=coverage.out -covermode=atomic ./core/... ./lib/... ./game/...

      - name: Coverage summary
        if: always()
        run: go tool cover -func=coverage.out

      - name: Coverage HTML report
        if: always()
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html

      - name: Build
        run: go build ./game/magic

  build-arm64:
    name: Build code on arm64
    # disabled on push for now; runs when the workflow is started by hand
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.27.0'

      - name: Install ubuntu dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libasound2-dev xorg-dev
          # for running the tests
          sudo apt-get -y install xvfb

      - name: Install go dependencies
        run: |
          go get ./...
          go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Test
        run: xvfb-run go test ./core/... ./lib/... ./game/...

      - name: Build
        run: go build ./game/magic
