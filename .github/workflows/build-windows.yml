name: Build Windows

# disabled for now (only Linux runs on push); start it by hand from the Actions tab
on: workflow_dispatch

jobs:
  build:
    name: Build code
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.27.0'

      - name: Install go dependencies
        run: |
          go get ./...
          go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./game/magic
